<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अबॅकस प्रो गेम</title>
    <style>
        /* डार्क ब्लॅक आणि निऑन ब्लू थीम */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19; 
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: #111827; 
            border: 2px solid #00d2ff; 
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.25);
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-sizing: border-box;
        }

        .screen { display: none; }
        .active { display: block; }

        h2 {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin-top: 0;
        }

        select {
            width: 100%;
            padding: 14px;
            margin: 15px 0 25px 0;
            background-color: #1f2937;
            border: 2px solid #374151;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        select:focus {
            border-color: #00d2ff;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        button {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }

        .btn-back {
            background: #1f2937;
            border: 2px solid #ef4444;
            color: #ef4444;
            width: auto;
            padding: 8px 18px;
            font-size: 14px;
            box-shadow: none;
        }
        .btn-back:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .option-btn {
            background-color: #0b0f19 !important; 
            border: 2px solid #374151 !important; 
            color: #ffffff !important;
            font-size: 22px;
            padding: 18px;
            margin: 0;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: none !important;
            text-shadow: none !important;
            outline: none !important;
            transition: none !important;
        }

        .option-btn:hover {
            background-color: #1f2937 !important;
            border-color: #4b5563 !important;
            color: #ffffff !important;
        }

        .option-btn.correct {
            background-color: #10b981 !important; 
            border-color: #10b981 !important;
            color: white !important;
        }

        .option-btn.wrong {
            background-color: #ef4444 !important; 
            border-color: #ef4444 !important;
            color: white !important;
        }

        /* गणित दिसणारा बॉक्स */
        .sum-box {
            background: #030712;
            border: 2px dashed #00d2ff;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            font-size: 44px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-width: 180px;
            line-height: 1.4;
        }

        .last-row {
            border-bottom: 3px solid #ffffff;
            width: 100%;
            text-align: right;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .row-item {
            width: 100%;
            text-align: right;
            box-sizing: border-box;
            padding-right: 20px;
        }

        .div-item {
            font-size: 38px;
            text-align: center;
            padding: 10px;
            letter-spacing: 1px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .timer-text { font-size: 18px; color: #38bdf8; font-weight: bold; }
        .score-text { font-size: 18px; color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">

    <!-- मुख्य मेनू -->
    <div id="mainMenuScreen" class="screen active">
        <h2>🧮 ABACUS PRO</h2>
        <p style="color: #9ca3af; margin-bottom: 20px;">तुमची लेव्हल आणि मोड निवडा</p>
        
        <label style="display:block; text-align:left; margin-bottom:5px; color:#9ca3af;">लेव्हल निवडा:</label>
        <select id="levelSelect">
            <option value="1">Level 1: 1-Digit बेरीज-वजाबाकी (३ संख्या)</option>
            <option value="2">Level 2: 1-Digit बेरीज-वजाबाकी (५ संख्या - ट्रिक्स)</option>
            <option value="3">Level 3: 2-Digit बेरीज-वजाबाकी</option>
            <option value="4">Level 4: 3-Digit मोठी बेरीज-वजाबाकी</option>
            <option value="5">Level 5: गुणाकार (2-Digit × 1-Digit)</option>
            <option value="6">Level 6: गुणाकार (3-Digit × 1-Digit)</option>
            <option value="7">Level 7: कठीण गुणाकार (2-Digit × 2-Digit)</option>
            <option value="8">Level 8: भागाकार (2-Digit & 3-Digit ÷ 1-Digit)</option>
            <option value="9">Level 9: ग्रँड मास्टर (मिश्र गुणाकार व भागाकार)</option>
        </select>

        <button onclick="startGame('practice')">📝 Practice Mode</button>
        <button onclick="startGame('test')">⏱️ Test Mode (10 Min)</button>
    </div>

    <!-- गेम प्ले स्क्रीन -->
    <div id="gamePlayScreen" class="screen">
        <div class="header-bar">
            <button class="btn-back" onclick="goBackToMenu()">⬅️ मेनू</button>
            <div id="timerDisplay" class="timer-text"></div>
        </div>
        
        <div id="scoreDisplay" class="score-text">स्कोअर: 0</div>

        <!-- गणित प्रश्न बॉक्स -->
        <div class="sum-box" id="sumQuestion"></div>

        <p style="color: #9ca3af; margin-bottom: 5px;">योग्य पर्याय निवडा:</p>
        
        <div class="options-grid">
            <button class="option-btn" id="opt0" onclick="checkAnswer(0)">0</button>
            <button class="option-btn" id="opt1" onclick="checkAnswer(1)">0</button>
            <button class="option-btn" id="opt2" onclick="checkAnswer(2)">0</button>
            <button class="option-btn" id="opt3" onclick="checkAnswer(3)">0</button>
        </div>
    </div>

</div>

<script>
    let currentMode = '';
    let currentLevel = 1;
    let correctAnswer = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 0;
    let currentOptions = [];
    let isClickable = true; 

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startGame(mode) {
        currentMode = mode;
        currentLevel = parseInt(document.getElementById('levelSelect').value);
        score = 0;
        isClickable = true;
        document.getElementById('scoreDisplay').innerText = "स्कोअर: " + score;

        if(mode === 'practice') {
            document.getElementById('timerDisplay').innerText = "Practice ♾️";
            clearInterval(timerInterval);
        } else {
            timeLeft = 10 * 60; 
            startTimer();
        }

        generateSum();
        showScreen('gamePlayScreen');
    }

    function createVerticalLayout(numbers) {
        let html = "";
        for(let i=0; i<numbers.length; i++) {
            let numStr = numbers[i] >= 0 && i > 0 ? "+ " + numbers[i] : (numbers[i] < 0 ? "- " + Math.abs(numbers[i]) : "  " + numbers[i]);
            if(i === numbers.length - 1) {
                html += `<div class="row-item last-row">${numStr}</div>`;
            } else {
                html += `<div class="row-item">${numStr}</div>`;
            }
        }
        return html;
    }

    function generateSum() {
        let questionHTML = "";
        
        for(let i = 0; i < 4; i++) {
            let btn = document.getElementById(`opt${i}`);
            btn.classList.remove('correct', 'wrong');
        }
        isClickable = true; 

        // LEVEL 1: 1-Digit बेरीज-वजाबाकी (३ संख्या)
        if (currentLevel === 1) {
            let n1 = Math.floor(Math.random() * 5) + 4; 
            let n2 = Math.floor(Math.random() * 3) + 1; 
            let n3 = Math.floor(Math.random() * 3) + 1; 
            correctAnswer = n1 + n2 - n3;
            questionHTML = createVerticalLayout([n1, n2, -n3]);
        } 
        // LEVEL 2: 1-Digit बेरीज-वजाबाकी (५ संख्या - फ्रेंड्स ट्रिक्स)
        else if (currentLevel === 2) {
            let n1 = Math.floor(Math.random() * 4) + 5; 
            let n2 = Math.floor(Math.random() * 4) + 1;
            let n3 = Math.floor(Math.random() * 3) + 1;
            let n4 = Math.floor(Math.random() * 4) + 1;
            let n5 = Math.floor(Math.random() * 3) + 1;
            correctAnswer = n1 + n2 - n3 + n4 - n5;
            questionHTML = createVerticalLayout([n1, n2, -n3, n4, -n5]);
        } 
        // LEVEL 3: 2-Digit बेरीज-वजाबाकी (३ संख्या)
        else if (currentLevel === 3) {
            let n1 = Math.floor(Math.random() * 40) + 40; 
            let n2 = Math.floor(Math.random() * 30) + 10;
            let n3 = Math.floor(Math.random() * 20) + 10;
            correctAnswer = n1 + n2 - n3;
            questionHTML = createVerticalLayout([n1, n2, -n3]);
        } 
        // LEVEL 4: 3-Digit बेरीज-वजाबाकी
        else if (currentLevel === 4) {
            let n1 = Math.floor(Math.random() * 400) + 300; 
            let n2 = Math.floor(Math.random() * 200) + 100;
            let n3 = Math.floor(Math.random() * 200) + 100;
            correctAnswer = n1 + n2 - n3;
            questionHTML = createVerticalLayout([n1, n2, -n3]);
        } 
        // LEVEL 5: गुणाकार (2-Digit × 1-Digit)
        else if (currentLevel === 5) {
            let n1 = Math.floor(Math.random() * 89) + 10; 
            let n2 = Math.floor(Math.random() * 8) + 2;  
            correctAnswer = n1 * n2;
            questionHTML = `<div class="row-item">${n1}</div><div class="row-item last-row">× ${n2}</div>`;
        } 
        // LEVEL 6: गुणाकार (3-Digit × 1-Digit)
        else if (currentLevel === 6) {
            let n1 = Math.floor(Math.random() * 899) + 100; 
            let n2 = Math.floor(Math.random() * 8) + 2;   
            correctAnswer = n1 * n2;
            questionHTML = `<div class="row-item">${n1}</div><div class="row-item last-row">× ${n2}</div>`;
        } 
        // LEVEL 7: कठीण गुणाकार (2-Digit × 2-Digit)
        else if (currentLevel === 7) {
            let n1 = Math.floor(Math.random() * 89) + 10; 
            let n2 = Math.floor(Math.random() * 89) + 10;  
            correctAnswer = n1 * n2;
            questionHTML = `<div class="row-item">${n1}</div><div class="row-item last-row">× ${n2}</div>`;
        } 
        // LEVEL 8: भागाकार (2 या 3-Digit ÷ 1-Digit)
        else if (currentLevel === 8) {
            let n2 = Math.floor(Math.random() * 8) + 2;   
            let ans = Math.random() > 0.5 ? Math.floor(Math.random() * 20) + 5 : Math.floor(Math.random() * 80) + 10; 
            let n1 = ans * n2;                            
            correctAnswer = ans;
            questionHTML = `<div class="div-item">${n1} ÷ ${n2}</div>`;
        } 
        // LEVEL 9: ग्रँड मास्टर (मिक्स कठीण गुणाकार व भागाकार)
        else if (currentLevel === 9) {
            let choice = Math.random() > 0.5;
            if(choice) {
                let n1 = Math.floor(Math.random() * 199) + 50; 
                let n2 = Math.floor(Math.random() * 15) + 6;  
                correctAnswer = n1 * n2;
                questionHTML = `<div class="row-item">${n1}</div><div class="row-item last-row">× ${n2}</div>`;
            } else {
                let n2 = Math.floor(Math.random() * 11) + 3;     
                let ans = Math.floor(Math.random() * 150) + 20; 
                let n1 = ans * n2;
                correctAnswer = ans;
                questionHTML = `<div class="div-item">${n1} ÷ ${n2}</div>`;
            }
        }

        document.getElementById('sumQuestion').innerHTML = questionHTML;

        // हुबेहूब क्लोज ऑप्शन्स तयार करणे
        let optionsSet = new Set();
        optionsSet.add(correctAnswer);

        while(optionsSet.size < 4) {
            let offset = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
            let wrongAns = correctAnswer + offset;
            if (currentLevel >= 5) {
                // गुणाकारात १० किंवा ५ चा फरक असणारे क्लोज पर्याय
                wrongAns = correctAnswer + (offset * (Math.random() > 0.5 ? 1 : 10));
            }
            if(wrongAns !== correctAnswer && wrongAns >= 0) {
                optionsSet.add(wrongAns);
            }
        }

        currentOptions = Array.from(optionsSet).sort(() => Math.random() - 0.5);

        for(let i = 0; i < 4; i++) {
            document.getElementById(`opt${i}`).innerText = currentOptions[i];
        }
    }

    function checkAnswer(selectedIndex) {
        if (!isClickable) return; 
        isClickable = false; 

        let selectedAns = currentOptions[selectedIndex];
        let clickedButton = document.getElementById(`opt${selectedIndex}`);

        if (selectedAns === correctAnswer) {
            clickedButton.classList.add('correct');
            score++;
            document.getElementById('scoreDisplay').innerText = "स्कोअर: " + score;
        } else {
            clickedButton.classList.add('wrong');
            for(let i = 0; i < 4; i++) {
                if(currentOptions[i] === correctAnswer) {
                    document.getElementById(`opt${i}`).classList.add('correct');
                }
            }
        }

        setTimeout(() => {
            generateSum();
        }, 1200);
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('timerDisplay').innerText = `⏱️ ${minutes}:${seconds}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("⏰ वेळ संपली! तुमचा फायनल स्कोअर: " + score);
                goBackToMenu();
            }
            timeLeft--;
        }, 1000);
    }

    function goBackToMenu() {
        clearInterval(timerInterval);
        showScreen('mainMenuScreen');
    }
</script>

</body>
</html>
